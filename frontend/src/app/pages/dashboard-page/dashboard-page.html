<section class="dashboard-toolbar">
  <reloader (tick)="onReload()" />
</section>

<section class="stat-cards">
  @for (card of cards(); track card.label) {
    <stat-card [data]="card" [loading]="loading()" [error]="error()" />
  }
</section>

<section class="dashboard-main">
  <portfolio-chart
    [data]="chartData()"
    (windowChange)="onWindowChange($event)"
    (timeframeChange)="onTimeframeChange($event)"
  />

  <transaction-area [(selection)]="selection" [config]="transactionConfig" (submit)="onSubmit()" />
</section>

<section class="dashboard-positions">
  <position-table [data]="activePositions()" />
  <position-table [data]="closedPositions()" />
</section>

<section class="dashboard-orderbook">
  <transaction-list [data]="orderbookData()" />
</section>
