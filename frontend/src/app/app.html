@if (!onAuthPage()) {
  <mat-toolbar class="app-toolbar">
    <a class="app-brand" routerLink="/dashboard">{{ title() }}</a>
  </mat-toolbar>

  <nav mat-tab-nav-bar [tabPanel]="tabPanel">
    @for (link of links; track link.path) {
      <a
        mat-tab-link
        [routerLink]="link.path"
        routerLinkActive
        #rla="routerLinkActive"
        [active]="rla.isActive"
      >
        {{ link.label }}
      </a>
    }
  </nav>
}

<mat-tab-nav-panel #tabPanel class="app-content">
  <router-outlet />
</mat-tab-nav-panel>
