@if (!onAuthPage()) {
  <mat-toolbar class="app-toolbar">
    <a class="app-brand" routerLink="/dashboard">{{ title() }}</a>
    <nav class="app-nav">
      @for (link of links; track link.path) {
        <a class="app-nav-link" [routerLink]="link.path" routerLinkActive="active">
          {{ link.label }}
        </a>
      }
    </nav>

    @if (user(); as u) {
      <span class="app-spacer"></span>
      <app-avatar [name]="u.name" label="User menu" [matMenuTriggerFor]="userMenu"></app-avatar>
      <mat-menu #userMenu="matMenu">
        <div class="app-menu-header">
          <app-avatar [name]="u.name" [button]="false"></app-avatar>
          <span class="app-username">{{ u.name }}</span>
        </div>
        <mat-divider class="app-menu-divider" />
        <a mat-menu-item routerLink="/settings">
          <mat-icon>settings</mat-icon>
          <span>Settings</span>
        </a>
        <button mat-menu-item (click)="logout()" [disabled]="loggingOut()">
          <mat-icon>logout</mat-icon>
          <span>Log out</span>
        </button>
      </mat-menu>
    }
  </mat-toolbar>
}

<main class="app-content">
  <router-outlet />
</main>
