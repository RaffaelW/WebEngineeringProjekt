# yaml-language-server: $schema=https://json.schemastore.org/pre-commit-config.json

# Global exclude pattern for build artifacts and dependencies
exclude: |
  (?x)^(node_modules/)

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Line ending checks
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: [--fix=lf]

      # Whitespace & formatting
      - id: trailing-whitespace

      # File format checks
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  # Spell checking
  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v10.0.1
    hooks:
      - id: cspell

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args:
          [
            --strict,
            -d,
            "{extends: default, rules: {line-length: {max: 120}, document-start: disable, truthy: disable}}",
          ]

  # Markdown linting
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.17.1
    hooks:
      - id: markdownlint-cli2

  # Formatting
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx prettier --write --ignore-unknown
        language: system
        types_or: [ts, javascript, json, html, css, scss, markdown]
        exclude: 'node_modules/|dist/|\.angular/'

  # JavaScript/TypeScript linting
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npx eslint --max-warnings=0
        language: system
        types_or: [ts, javascript]
        exclude: "node_modules/|dist/"
